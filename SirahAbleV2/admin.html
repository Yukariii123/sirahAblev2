<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUSYS — Sistem Pengurusan Pendidikan (CMS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Assets/css/homepage.css">
    <style>
        body { background-color: #040810; color: #F1F5F9; font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px; }
        .cms-container { max-width: 1200px; margin: 0 auto; }
        .cms-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 20px; }
        
        .edusys-logo { display: flex; flex-direction: column; }
        .edusys-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 2.2rem; color: #FFF; letter-spacing: 2px; margin: 0; }
        .edusys-title span { color: #D4AF37; }
        .edusys-subtitle { font-size: 0.8rem; color: #4ECCA3; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        
        .btn-link { color: #94A3B8; text-decoration: none; font-weight: 600; transition: 0.3s; background: rgba(255, 255, 255, 0.05); padding: 10px 20px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .btn-link:hover { color: #040810; background: #D4AF37; }

        .glass-panel { background: rgba(10, 20, 38, 0.8); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; color: #94A3B8; font-weight: 600; }
        .form-group select, .form-group textarea, .form-group input { background: rgba(6, 13, 26, 0.6); border: 1px solid rgba(212, 175, 55, 0.2); color: #FFF; padding: 12px; border-radius: 8px; font-family: inherit; outline: none; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .ai-box { background: rgba(13, 92, 70, 0.15); border: 1px dashed #4ECCA3; padding: 15px; border-radius: 8px; display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .btn-ai { background: linear-gradient(135deg, #0D5C46, #4ECCA3); color: #FFF; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-ai:hover { box-shadow: 0 0 15px rgba(78, 204, 163, 0.4); transform: translateY(-2px); }
        .btn-ai:disabled { background: #4A5568; cursor: not-allowed; transform: none; box-shadow: none; }

        .notif-box { background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .notif-box input[type="checkbox"] { width: 18px; height: 18px; accent-color: #D4AF37; cursor: pointer; }
        .notif-box label { color: #F5E08C; font-weight: 600; font-size: 0.95rem; cursor: pointer; }

        .btn-submit { background: #D4AF37; color: #040810; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-submit:hover { background: #F5E08C; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }

        .table-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #FFF; margin-bottom: 20px; font-size: 1.3rem; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); color: #D4AF37; text-align: left; font-size: 0.9rem; }
        td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; }
        .status-aktif { color: #4ECCA3; font-weight: 600; }
        .status-lulus { color: #D4AF37; font-weight: 600; }
        .status-bimbingan { color: #FF6B6B; font-weight: 600; }
    </style>
</head>
<body>

    <div class="cms-container">
        <div class="cms-header">
            <div class="edusys-logo">
                <h1 class="edusys-title">EDU<span>SYS</span></h1>
                <span class="edusys-subtitle">Modul Integrasi: SirahAble</span>
            </div>
            <div style="display:flex; gap:10px;">
                <a href="dashboard.html" class="btn-link">Ke Dashboard</a>
                <a href="index.html" class="btn-link">Portal Utama</a>
                <a href="api/logout.php" class="btn-link">Log Keluar</a>
            </div>
        </div>

        <div class="glass-panel">
            <h2 class="table-title">TAMBAH KANDUNGAN PENDIDIKAN</h2>
            
            <div class="ai-box">
                <div style="flex-grow: 1;">
                    <label style="color:#4ECCA3; font-weight:700; font-size:0.85rem; display:block; margin-bottom:5px;">🤖 EDUSYS AI Auto-Generate (Berasaskan Fail)</label>
                    <input type="file" id="ai-file" accept=".txt,.pdf,.docx" style="width:100%; border:none; padding:0; background:transparent;">
                </div>
                <button type="button" class="btn-ai" id="btn-generate-ai">Jana Soalan AI</button>
            </div>

            <form id="form-add-question">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pilih Modul Penempatan</label>
                        <select id="q-module">
                            <option value="1">Modul 1: Penubuhan & Kebangkitan</option>
                            <option value="2">Modul 2: Kota Baghdad</option>
                            <option value="3">Modul 3: Era Keemasan Ilmu</option>
                            <option value="4">Modul 4: Kemerosotan Politik</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pilihan Jawapan Tepat (Kunci Jawapan)</label>
                        <select id="q-answer">
                            <option value="A">Pilihan A</option>
                            <option value="B">Pilihan B</option>
                            <option value="C">Pilihan C</option>
                            <option value="D">Pilihan D</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Pernyataan Soalan / Dialog</label>
                    <textarea id="q-statement" placeholder="Masukkan soalan objektif format di sini..."></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Penerangan Hujah Sejarah (Academic Explanation)</label>
                    <textarea id="q-explanation" placeholder="Sistem akan memaparkan fakta ini jika pelajar menjawab salah..."></textarea>
                </div>

                <div class="notif-box">
                    <input type="checkbox" id="send-notif" checked>
                    <label for="send-notif">Hantar Notifikasi (EDUSYS Push Alert) kepada semua pelajar yang mengambil subjek ini.</label>
                </div>

                <button type="button" class="btn-submit" id="btn-submit-edusys">MUAT NAIK KE PELAYAN EDUSYS</button>
            </form>
        </div>

        <div class="glass-panel">
            <h2 class="table-title">PEMANTAUAN PRESTASI PELAJAR</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID & Nama Pelajar</th>
                        <th>Kadar Siap Modul</th>
                        <th>Mata Ilmu (XP)</th>
                        <th>Skor Ujian Akhir</th>
                        <th>Status Analitik EDUSYS</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <tr><td colspan="5" style="text-align:center;">Memuatkan data dari pangkalan data EDUSYS...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="Assets/js/admin.js"></script>
</body>
</html>
